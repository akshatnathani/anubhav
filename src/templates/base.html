<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<style>
  :root { --bg:#f5f3ee; --card:#fff; --ink:#1c1b19; --muted:#6d6a63; --line:#e4e0d8;
          --ok:#1d8a4e; --ok-bg:#e5f4eb; --bad:#c63d22; --bad-bg:#fdeae5; --warn:#a86b00; --warn-bg:#fff2d9;
          --accent:#3056d3; --accent-ink:#fff; --track:#e9e5dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --card:#1e1e1e; --ink:#ecebe8; --muted:#a3a09a; --line:#2f2f2f;
            --ok:#4cc38a; --ok-bg:#16301f; --bad:#ff7a5c; --bad-bg:#3a1c15; --warn:#f0b54a; --warn-bg:#3a2c10;
            --accent:#6c8cff; --accent-ink:#0b0b0b; --track:#2a2a2a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  a { color:var(--accent); }
  nav { background:var(--card); border-bottom:1px solid var(--line); padding:.65rem 1rem; display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
  nav a { color:var(--ink); text-decoration:none; font-weight:500; opacity:.8; } nav a:hover { opacity:1; }
  nav .brand { font-weight:800; opacity:1; margin-right:auto; letter-spacing:-.01em; }
  main { max-width:880px; margin:0 auto; padding:1.25rem 1rem 4rem; }
  h1 { font-size:1.55rem; margin:.2rem 0 .3rem; letter-spacing:-.02em; }
  h2 { font-size:1.1rem; margin:0 0 .6rem; }
  .sub { color:var(--muted); margin:0 0 1.2rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1rem 1.1rem; margin-bottom:1rem; }
  .muted { color:var(--muted); font-size:.9rem; }
  .flash { padding:.65rem .9rem; border-radius:10px; margin-bottom:.8rem; }
  .flash.ok { background:var(--ok-bg); color:var(--ok); } .flash.error { background:var(--bad-bg); color:var(--bad); }
  .errors { background:var(--bad-bg); color:var(--bad); border-radius:10px; padding:.6rem 1rem .6rem 2rem; margin:0 0 1rem; }
  label { display:block; font-weight:600; margin:.85rem 0 .25rem; }
  label .hint { font-weight:400; color:var(--muted); font-size:.85rem; }
  label.check { font-weight:400; display:flex; gap:.45rem; align-items:center; }
  input[type=text], input[type=url], input[type=email], input[type=number], input[type=password], input[type=time], select, textarea {
    width:100%; padding:.6rem .7rem; border:1px solid var(--line); border-radius:9px; font:inherit; background:var(--bg); color:var(--ink); }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
  textarea { min-height:7rem; resize:vertical; } textarea.code { font-family:ui-monospace,monospace; font-size:.85rem; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:0 .8rem; }
  button, .btn { display:inline-block; background:var(--accent); color:var(--accent-ink); border:0; border-radius:9px;
    padding:.6rem 1.1rem; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; margin-top:1rem; }
  .btn.secondary, button.secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--bad); border:1px solid var(--bad); }
  .btn.small, button.small { padding:.35rem .75rem; font-size:.85rem; margin-top:0; }
  .pill { display:inline-block; padding:.12rem .6rem; border-radius:99px; font-size:.8rem; font-weight:600; white-space:nowrap; }
  .pill.done { background:var(--ok-bg); color:var(--ok); } .pill.pending { background:var(--warn-bg); color:var(--warn); }
  .pill.missed, .pill.off { background:var(--bad-bg); color:var(--bad); }
  .grid { display:flex; gap:3px; flex-wrap:wrap; margin-top:.7rem; }
  .cell { display:inline-block; width:15px; height:15px; border-radius:4px; background:var(--track); }
  .cell.done { background:var(--ok); } .cell.missed { background:var(--bad); opacity:.75; }
  .cell.pending { background:transparent; box-shadow:inset 0 0 0 2px var(--warn); }
  .legend { display:flex; gap:.9rem; flex-wrap:wrap; margin-top:.5rem; font-size:.8rem; color:var(--muted); }
  .legend span { display:inline-flex; align-items:center; gap:.3rem; } .legend .cell { width:11px; height:11px; }
  .counter { font-size:.8rem; color:var(--muted); text-align:right; } .counter.good { color:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:.45rem .5rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; }
  .table-wrap { overflow-x:auto; }
  details summary { cursor:pointer; font-weight:600; }
  pre { white-space:pre-wrap; background:var(--bg); padding:.6rem; border-radius:8px; font-size:.85rem; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:.8rem; }
  .stat .v { font-size:1.5rem; font-weight:800; letter-spacing:-.02em; }
  .stat .k { color:var(--muted); font-size:.82rem; }
  .progress { height:8px; background:var(--track); border-radius:99px; overflow:hidden; margin-top:.6rem; }
  .progress > div { height:100%; background:var(--ok); border-radius:99px; }
  .inline { display:inline; }
  .tabs { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1rem; } .tabs .btn { margin:0; }
</style>
</head>
<body>
{% if me %}
<nav>
  <a class="brand" href="{{ url_for('home') }}">{{ app_name }}</a>
  {% if me.is_admin %}
    <a href="{{ url_for('admin_home') }}">Members</a>
  {% else %}
    <a href="{{ url_for('home') }}">Today</a>
    <a href="{{ url_for('history') }}">History</a>
  {% endif %}
  <a href="{{ url_for('account') }}">Account</a>
  <a href="{{ url_for('logout') }}">Log out</a>
</nav>
{% endif %}
<main>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script>
  document.querySelectorAll('[data-min]').forEach(function (el) {
    var c = document.createElement('div'); c.className = 'counter'; el.after(c);
    function upd() { var n = el.value.trim().length, m = +el.dataset.min;
      c.textContent = n + ' / ' + m + ' characters minimum'; c.classList.toggle('good', n >= m); }
    el.addEventListener('input', upd); upd();
  });
  document.querySelectorAll('form[data-confirm]').forEach(function (f) {
    f.addEventListener('submit', function (e) { if (!confirm(f.dataset.confirm)) e.preventDefault(); });
  });
</script>
</body>
</html>
