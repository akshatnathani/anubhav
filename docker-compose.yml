services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env          # DATABASE_URL points at Supabase
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 60s
      timeout: 10s
      retries: 3
    mem_limit: 160m

  # Optional: public HTTPS URL without opening ports (needed so Apps Script and your brother can reach it).
  # Enable with:  docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
